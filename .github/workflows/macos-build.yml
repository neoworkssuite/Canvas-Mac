name: NeoCanvas macOS CI

on:
  push:
    branches:
      - ipad-dev
      - macos-**
    paths:
      - "core/**"
      - "brushes/**"
      - "renderer/**"
      - "ui/**"
      - "macosApp/**"
      - "settings.gradle.kts"
      - ".github/workflows/macos-build.yml"
  pull_request:
    paths:
      - "core/**"
      - "brushes/**"
      - "renderer/**"
      - "ui/**"
      - "macosApp/**"
      - "settings.gradle.kts"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: macOS shared host and DMG
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify host contract
        run: python3 scripts/verify_macos_host.py
      - name: Run shared tests
        run: ./gradlew :core:desktopTest :brushes:desktopTest :renderer:desktopTest :ui:desktopTest
      - name: Package macOS DMG
        run: ./gradlew :macosApp:packageDmg
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: NeoCanvas-macOS-${{ github.sha }}
          path: macosApp/build/compose/binaries/main/dmg/
          if-no-files-found: error
          retention-days: 14
