name: NeoCanvas shared validation
on:
  push:
    branches: [main, ipad-dev]
    paths: ["core/**", "brushes/**", "renderer/**", "ui/**", "scripts/**", "docs/**", "*.gradle.kts", ".github/workflows/shared-validation.yml"]
  pull_request:
    paths: ["core/**", "brushes/**", "renderer/**", "ui/**", "scripts/**", "docs/**", "*.gradle.kts", ".github/workflows/shared-validation.yml"]
  workflow_dispatch:
concurrency:
  group: shared-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Verify repository contracts
        run: |
          python3 scripts/verify-version-contract.py
          python3 scripts/verify-release-contract.py
          python3 scripts/verify_macos_host.py
          python3 scripts/verify_android_host.py
          python3 scripts/verify_parity_docs.py
      - name: Run shared tests
        run: ./gradlew :core:desktopTest :brushes:desktopTest :renderer:desktopTest :ui:desktopTest
