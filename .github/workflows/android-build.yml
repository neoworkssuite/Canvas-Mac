name: NeoCanvas Android CI

on:
  push:
    branches: [main, ipad-dev, "android-**"]
    paths:
      - "core/**"
      - "brushes/**"
      - "renderer/**"
      - "ui/**"
      - "androidApp/**"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "core/**"
      - "brushes/**"
      - "renderer/**"
      - "ui/**"
      - "androidApp/**"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew
      - name: Verify canonical Android host
        run: python3 scripts/verify_android_host.py
      - name: Run Android unit tests, lint, and assemble debug APK
        run: ./gradlew :androidApp:testDebugUnitTest :androidApp:lintDebug :androidApp:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neocanvas-android-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 14
